<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>数学小游戏 · 主页</title>
<style>
  :root {
    --bg: #EAE4D6;
    --page: #F7F3EA;
    --card: #FFFDF8;
    --ink: #2B2A26;
    --ink2: #6B6760;
    --ink3: #A9A294;
    --rule: #DCD5C6;
    --teal: #1D9E75;
    --teal-bg: #E1F5EE;
    --amber: #C4872B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
  body { -webkit-tap-highlight-color: transparent; }
  #stage {
    min-height: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: var(--page);
    padding: 34px 24px 40px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
  }
  .title { text-align: center; font-size: 27px; font-weight: 600; margin: 0; letter-spacing: 1px; }
  .subtitle { text-align: center; font-size: 11.5px; color: var(--ink3); margin: 10px 0 26px; }
  .grid { display: flex; flex-direction: column; gap: 14px; }
  a.gcard {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 18px;
    padding: 18px 18px 16px;
    transition: transform .08s ease;
  }
  a.gcard:active { transform: scale(0.985); }
  .gcard .head { display: flex; align-items: center; gap: 14px; }
  .gcard svg { flex: 0 0 96px; }
  .gcard .name { font-size: 19px; font-weight: 600; }
  .gcard .desc { font-size: 11.5px; color: var(--ink3); margin-top: 5px; }
  .gcard .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .gcard .count { font-size: 10.5px; color: var(--ink3); }
  .gcard .go {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; font-weight: 500; color: var(--teal);
    background: var(--teal-bg);
    border-radius: 15px;
    padding: 6px 14px;
  }
  .badge-new {
    display: inline-block; vertical-align: 3px;
    margin-left: 8px; padding: 1px 7px;
    font-size: 9.5px; font-weight: 500; color: var(--amber);
    background: #FAEEDA; border-radius: 8px;
  }
  .foot { text-align: center; font-size: 10.5px; color: var(--ink3); margin-top: 26px; }
</style>
</head>
<body>
<div id="stage">
  <h1 class="title">数学小游戏</h1>
  <p class="subtitle">数轴 · 角 · 逐步推理</p>

  <div class="grid">

    <a class="gcard" href="abs/index.html">
      <div class="head">
        <svg width="96" height="64" viewBox="0 0 96 64" aria-hidden="true">
          <line x1="8" y1="44" x2="88" y2="44" stroke="#C4BCA8" stroke-width="1.6"/>
          <path d="M8 44 l7 -3.4 v6.8 Z" fill="#C4BCA8"/>
          <path d="M88 44 l-7 -3.4 v6.8 Z" fill="#C4BCA8"/>
          <line x1="24" y1="48" x2="24" y2="40" stroke="#C4BCA8" stroke-width="1.2"/>
          <line x1="48" y1="48" x2="48" y2="40" stroke="#C4BCA8" stroke-width="1.2"/>
          <line x1="72" y1="48" x2="72" y2="40" stroke="#C4BCA8" stroke-width="1.2"/>
          <circle cx="24" cy="44" r="6.5" fill="#FFFDF8" stroke="#1D9E75" stroke-width="2"/>
          <circle cx="72" cy="44" r="6.5" fill="#FFFDF8" stroke="#1D9E75" stroke-width="2"/>
          <path d="M24 54 Q48 62 72 54" fill="none" stroke="#C4872B" stroke-width="1.6"/>
          <text x="48" y="63" text-anchor="middle" font-size="8" fill="#6B6760">|a − b|</text>
        </svg>
        <div>
          <div class="name">绝对距离</div>
          <div class="desc">数轴上的点 · 线段与动点 · 绝对值化简</div>
        </div>
      </div>
      <div class="meta">
        <span class="count">13 章 · 48 关</span>
        <span class="go">进入 ›</span>
      </div>
    </a>

    <a class="gcard" href="angle/index.html">
      <div class="head">
        <svg width="96" height="64" viewBox="0 0 96 64" aria-hidden="true">
          <path d="M84 52 A64 64 0 0 0 20 16" fill="none" stroke="#CFC6B2" stroke-width="1.4" stroke-dasharray="3 3"/>
          <line x1="20" y1="52" x2="84" y2="52" stroke="#2B2A26" stroke-width="2"/>
          <line x1="20" y1="52" x2="56" y2="22" stroke="#1D9E75" stroke-width="2"/>
          <path d="M40 52 A20 20 0 0 0 34.5 39.5" fill="none" stroke="#2B2A26" stroke-width="1.4"/>
          <circle cx="20" cy="52" r="3.4" fill="#2B2A26"/>
          <circle cx="56" cy="22" r="6" fill="#1D9E75"/>
          <text x="13" y="61" font-size="9" fill="#2B2A26">O</text>
          <text x="86" y="56" font-size="9" fill="#2B2A26">A</text>
          <text x="41" y="44" font-size="8.5" fill="#6B6760">60°</text>
        </svg>
        <div>
          <div class="name">角与角度<span class="badge-new">NEW</span></div>
          <div class="desc">角的定义 · 度分秒换算 · 数角</div>
        </div>
      </div>
      <div class="meta">
        <span class="count">3 章 · 26 关</span>
        <span class="go">进入 ›</span>
      </div>
    </a>

  </div>

  <p class="foot">更多关卡与章节，陆续上线</p>
</div>
<script>
  // 发布平台的分享链接带 ?sharecode=…，子页面也必须带上才能访问；
  // 这里把当前链接里的 sharecode 透传给两个游戏入口（本地打开时没有该参数则跳过）。
  (function () {
    try {
      var code = new URLSearchParams(location.search).get('sharecode');
      if (!code) return;
      var cards = document.querySelectorAll('a.gcard');
      for (var i = 0; i < cards.length; i++) {
        var a = cards[i];
        a.setAttribute('href', a.getAttribute('href') + '?sharecode=' + encodeURIComponent(code));
      }
    } catch (e) {}
  })();
</script>
</body>
</html>
