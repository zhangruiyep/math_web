<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>角与角度 · 拖动射线凑度数</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #EAE4D6;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: #F7F3EA;
    overflow: hidden;
    touch-action: none;
  }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; }
  #back {
    position: absolute; left: 10px; top: 8px;
    width: 34px; height: 34px;
    display: none;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script src="engine.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var game = new AngleGame(ctx);
  var dpr = Math.min(window.devicePixelRatio || 1, 3);

  function resize() {
    var r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    game.resize(r.width, r.height);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();

  // 仅供测试的地址参数：?level=0&menu=1&deg=75&qi=2&solve=1
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('menu') !== '1' && q.has('level')) {
      game.loadLevel(parseInt(q.get('level'), 10) || 0);
      game.mode = 'play';
    }
    if (q.has('deg')) {
      var d = parseFloat(q.get('deg'));
      if (!isNaN(d)) game.deg = Math.max(0, Math.min(360, Math.round(d)));
    }
    if (q.get('ghost') === '1') game.levelStartAt -= 12;
    if (q.has('miss')) game.misses = parseInt(q.get('miss'), 10) || 0;
    if (q.has('qi') && game.level().qs) {
      var lvq = game.level(), qi0 = parseInt(q.get('qi'), 10) || 0;
      game.qi = Math.max(0, Math.min(lvq.qs.length - 1, qi0));
      game.deg = lvq.qs[game.qi].deg;
    }
    if (q.get('wrong') === '1') {
      var lvw = game.level();
      if (lvw.kind === 'quiz') {
        var qw = game.curQ();
        game.pointer('down', 0, 0);
        game.qFlash = { ok: false, i: (qw.ans + 1) % lvw.opts.length };
        game.qWrong = 1;
        game.qWhy = qw.why;
      } else if (lvw.kind === 'pick' || lvw.kind === 'tap') {
        game.pickBad = lvw.kind === 'pick' ? 1 : 0;
        game.misses = 1;
        game.qWhy = lvw.kind === 'pick' ? lvw.why[1] : lvw.why.A;
      }
    }
    if (q.has('multi')) {
      var ms = game.level();
      if (ms.kind === 'multi') {
        q.get('multi').split(',').forEach(function (v) {
          var k = parseInt(v, 10);
          if (k >= 0 && k <= 3) game.multiSel[k] = true;
        });
      }
    }
    if (q.get('solve') === '1') {
      game.autoSolve();
      game.t = game.solvedAt + 2;
    }
  } catch (e) {}

  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  var down = false;
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    down = true;
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    var p = pos(e);
    game.pointer('down', p.x, p.y);
  });
  cv.addEventListener('pointermove', function (e) {
    if (!down) return;
    e.preventDefault();
    var p = pos(e);
    game.pointer('move', p.x, p.y);
  });
  cv.addEventListener('pointerup', function (e) {
    if (!down) return;
    down = false;
    var p = pos(e);
    game.pointer('up', p.x, p.y);
  });
  cv.addEventListener('pointercancel', function () {
    down = false;
    game.pointer('up', -999, -999);
  });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { game.pointer('down', -999, -999); game.pointer('up', -999, -999); }
  });

  var last = performance.now();
  var warm = 0;
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (warm < 4) { warm++; resize(); }
    game.frame(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
